# Acceptance overlay: boot the shipped ACP profile with the DeepSeek account
# route the web profile uses, plus the v2 multi-binding adapter engine and its
# tool row. Absolute module paths keep the profile dependency-free.
#
# No session is pre-bound: the ACP controller asks each session to call
# inbox_adapter_bind with its own BindingDescriptor (Mode A).
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: deepseek-account
    model: deepseek-flash
- id: acp
  name: '@deepseek-ai/dsh-acp'
  config:
    provider: deepseek-account
    model: deepseek-flash
- insert:
    - id: inbox-mosire-adapter
      name: '/home/cna/InboxMosire-DSH/index.js'
      config:
        apiUrl: http://127.0.0.1:18765
        debounceMs: 300
        heartbeatTimeoutSeconds: 45
        stateFile: /tmp/inbox-mosire-acp/state-v2.json
        logFile: /tmp/inbox-mosire-acp/adapter.log
    - id: inbox-mosire-tools
      name: '/home/cna/InboxMosire-DSH/tools.js'
