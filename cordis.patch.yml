# InboxMosire wake adapter for DeepSeek Harness.
#
# Three rows, one feature:
#   inbox-mosire-profiles  named wake profiles (`inboxWakeProfiles` service)
#   inbox-mosire-adapter   long-lived wake engine (SSE, binding, followup)
#   inbox-mosire-tools     model-facing tools that delegate to `/inbox`
#
# `client.js` (declared through `dsh.client`) adds the optional Web UI
# inbox-count dock panel; it is loaded by the browser, not by a Loader row.
#
# The engine row is inert until an inbox binding exists: either `config.sessionId`
# names a Session (or `"auto"`), or a human runs `/inbox bind`, or the model calls
# `inbox_adapter_bind`. Runtime configuration is documented in README.md; the
# token is read from a local secret file and is never part of this row.
- insert:
    - id: inbox-mosire-profiles
      name: '@mosire/dsh-inbox-mosire/profiles'
    - id: inbox-mosire-adapter
      name: '@mosire/dsh-inbox-mosire'
    - id: inbox-mosire-tools
      name: '@mosire/dsh-inbox-mosire/tools'
